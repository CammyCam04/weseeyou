name: CD Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target AWS Environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
      deploy_scope:
        description: "Deployment Scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend-only
          - backend-only

concurrency:
  group: cd-deploy-${{ github.ref }}-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS (${{ inputs.target_environment }})
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ inputs.target_environment == 'dev' && secrets.AWS_DEV_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800

      # -------------------------------------------------------------
      # 1. FRONTEND DEPLOYMENT (Dynamic S3 & CloudFront Discovery)
      # -------------------------------------------------------------
      - name: Setup Node.js for Frontend Build
        if: inputs.deploy_scope == 'all' || inputs.deploy_scope == 'frontend-only'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/we-see-you/package-lock.json

      - name: Build Next.js Static Export
        if: inputs.deploy_scope == 'all' || inputs.deploy_scope == 'frontend-only'
        working-directory: Frontend/we-see-you
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

      - name: Discover Active AWS Resources & Deploy Frontend
        if: inputs.deploy_scope == 'all' || inputs.deploy_scope == 'frontend-only'
        run: |
          ENV_NAME="${{ inputs.target_environment }}"
          echo "Discovering active S3 bucket for environment: $ENV_NAME..."
          
          # Dynamically locate the S3 frontend bucket matching project prefix
          S3_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'weseeyou-${ENV_NAME}-frontend')].Name" --output text | awk '{print $1}')
          
          if [ -z "$S3_BUCKET" ] || [ "$S3_BUCKET" == "None" ]; then
            echo "Error: Could not find active S3 frontend bucket for weseeyou-${ENV_NAME}!"
            exit 1
          fi
          
          echo "Found S3 Bucket: $S3_BUCKET"
          echo "Syncing Next.js static build to s3://$S3_BUCKET..."
          aws s3 sync Frontend/we-see-you/out s3://$S3_BUCKET --delete

          # Dynamically locate active CloudFront Distribution ID
          echo "Discovering active CloudFront Distribution ID..."
          CF_DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Comment, 'weseeyou-${ENV_NAME}')].Id" --output text | awk '{print $1}')
          
          if [ -n "$CF_DIST_ID" ] && [ "$CF_DIST_ID" != "None" ]; then
            echo "Found CloudFront Distribution: $CF_DIST_ID"
            echo "Invalidating CloudFront cache across all edge locations..."
            aws cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*"
          else
            echo "Warning: No CloudFront distribution found matching weseeyou-${ENV_NAME}. Skipping invalidation."
          fi

      # -------------------------------------------------------------
      # 2. BACKEND DEPLOYMENT (Amazon ECR + ECS Fargate Rolling Restart)
      # -------------------------------------------------------------
      - name: Log in to Amazon ECR
        if: inputs.deploy_scope == 'all' || inputs.deploy_scope == 'backend-only'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Docker Image
        if: (inputs.deploy_scope == 'all' || inputs.deploy_scope == 'backend-only') && env.ECR_REGISTRY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY || 'weseeyou-backend' }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: Backend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon ECS Fargate
        if: inputs.deploy_scope == 'all' || inputs.deploy_scope == 'backend-only'
        run: |
          ENV_NAME="${{ inputs.target_environment }}"
          CLUSTER_NAME="weseeyou-${ENV_NAME}-cluster"
          SERVICE_NAME="weseeyou-${ENV_NAME}-backend-service"
          
          echo "Triggering rolling deployment on ECS Cluster: $CLUSTER_NAME (Service: $SERVICE_NAME)..."
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
