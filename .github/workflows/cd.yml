name: CD Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target AWS Environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
      domain_name:
        description: "Domain Name for App"
        required: false
        default: "weseeyou.app"

concurrency:
  group: cd-deploy-${{ github.ref }}-${{ github.event.inputs.target_environment || 'prod' }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ github.event.inputs.target_environment || 'prod' }}
  DOMAIN_NAME: ${{ github.event.inputs.domain_name || 'weseeyou.app' }}
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  deploy:
    name: Provision & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------------------------------------
      # 1. TERRAFORM INFRASTRUCTURE PROVISIONING
      # -------------------------------------------------------------
      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init & Apply
        id: terraform
        working-directory: terraform
        run: |
          echo "Initializing Terraform..."
          terraform init

          echo "Applying Terraform Infrastructure for environment=${TARGET_ENV} and domain_name=${DOMAIN_NAME}..."
          terraform apply -auto-approve \
            -var="environment=${TARGET_ENV}" \
            -var="domain_name=${DOMAIN_NAME}"

          SERVER_IP=$(terraform output -raw public_ip)
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_OUTPUT
          echo "Successfully provisioned AWS Infrastructure at IP: ${SERVER_IP}"

      # -------------------------------------------------------------
      # 2. FRONTEND BUILD & EXPORT
      # -------------------------------------------------------------
      - name: Setup Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/we-see-you/package-lock.json

      - name: Build Next.js Static Web Application
        working-directory: Frontend/we-see-you
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

      # -------------------------------------------------------------
      # 3. OPTIONAL REMOTE CONTAINER DEPLOYMENT VIA SSH
      # -------------------------------------------------------------
      - name: Deploy Docker Stack to Server (Optional)
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.terraform.outputs.SERVER_IP }}
          username: ubuntu
          key: ${{ env.SSH_KEY }}
          script: |
            set -e
            if [ ! -d "/home/ubuntu/weseeyou" ]; then
              git clone https://github.com/${{ github.repository }}.git /home/ubuntu/weseeyou
            fi
            cd /home/ubuntu/weseeyou
            git fetch --all
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
