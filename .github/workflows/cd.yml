name: CD Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target AWS Environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
      domain_name:
        description: "Domain Name for App"
        required: false
        default: "weseeyou.app"

concurrency:
  group: cd-deploy-${{ github.ref }}-${{ github.event.inputs.target_environment || 'prod' }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ github.event.inputs.target_environment || 'prod' }}
  DOMAIN_NAME: ${{ github.event.inputs.domain_name || 'weseeyou.app' }}
  AWS_REGION: "us-east-1"
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_KEY_NAME: ${{ secrets.SSH_KEY_NAME || 'weseeyou-key' }}

jobs:
  deploy:
    name: Provision & Deploy to AWS (${{ github.event.inputs.target_environment || 'prod' }})
    environment: ${{ github.event.inputs.target_environment || 'prod' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. AWS AUTHENTICATION & TERRAFORM PROVISIONING
      # -------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init & Apply
        id: terraform
        working-directory: terraform
        run: |
          echo "Initializing Terraform..."
          terraform init

          echo "Applying Terraform Infrastructure for environment=${TARGET_ENV} and domain_name=${DOMAIN_NAME}..."
          terraform apply -auto-approve \
            -var="environment=${TARGET_ENV}" \
            -var="domain_name=${DOMAIN_NAME}" \
            -var="ssh_key_name=${SSH_KEY_NAME}"

          SERVER_IP=$(terraform output -raw public_ip)
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_OUTPUT
          echo "Successfully provisioned AWS Infrastructure at IP: ${SERVER_IP}"

      # -------------------------------------------------------------
      # 2. FRONTEND BUILD ON RUNNER
      # -------------------------------------------------------------
      - name: Setup Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/we-see-you/package-lock.json

      - name: Build Next.js Static Web Application
        working-directory: Frontend/we-see-you
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: 1

      # -------------------------------------------------------------
      # 3. REMOTE CONTAINER & FRONTEND DEPLOYMENT VIA SSH/SCP
      # -------------------------------------------------------------
      - name: Sync Code Repository to Server
        if: env.SSH_PRIVATE_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.terraform.outputs.SERVER_IP }}
          username: ubuntu
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if [ ! -d "/home/ubuntu/weseeyou" ]; then
              git clone https://github.com/${{ github.repository }}.git /home/ubuntu/weseeyou
            fi
            cd /home/ubuntu/weseeyou
            git fetch --all
            git reset --hard origin/main
            sudo chown -R ubuntu:ubuntu /home/ubuntu/weseeyou

      - name: Upload Compiled Next.js HTML/JS Assets to Server
        if: env.SSH_PRIVATE_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.terraform.outputs.SERVER_IP }}
          username: ubuntu
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "Frontend/we-see-you/out"
          target: "/home/ubuntu/weseeyou/"
          overwrite: true

      - name: Start Docker Application Stack
        if: env.SSH_PRIVATE_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.terraform.outputs.SERVER_IP }}
          username: ubuntu
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/weseeyou
            sudo usermod -aG docker ubuntu || true
            export ACME_EMAIL="${{ secrets.ACME_EMAIL }}"
            sudo -E docker compose -f docker-compose.prod.yml up -d --build
